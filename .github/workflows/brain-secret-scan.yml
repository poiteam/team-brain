name: brain-secret-scan
# The CI side of the fail-closed secret scan: catches what the pre-push hook cannot
# (another machine, git push --no-verify, an edit in the GitHub UI).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    if: github.repository != 'poiteam/team-brain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zero" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            files="$(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA"..HEAD)"
          else
            files="$(git ls-files)"
          fi
          list=()
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && list+=("$f")
          done <<< "$files"
          [ "${#list[@]}" -gt 0 ] || { echo "nothing to scan"; exit 0; }
          bash hooks/scan-secrets.sh "${list[@]}"
