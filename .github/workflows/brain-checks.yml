name: brain-checks
# Generated tables must match their sources: policies/CANDIDATES.md is a projection
# of policies/candidates/*.md, and queue/candidates.md must stay parseable. A stale
# table means a hand edit or a skipped compiler step — the compiler does not merge red.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.repository != 'poiteam/team-brain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Policy candidate table is current
        run: python3 compiler/candidates.py --check
      - name: Queue is well-formed
        run: python3 compiler/queue_candidates.py --check
