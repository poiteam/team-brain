name: Something does not work
description: A hook, the compiler, install or update misbehaves
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bash install.sh doctor`
      description: Run it in your brain repo and paste the whole output. If the nightly compiler is affected, run `bash install.sh doctor --runner` on the runner machine.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Claude Code version
      placeholder: macOS 15.1, Claude Code 2.x
